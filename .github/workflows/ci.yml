name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs when a newer commit lands on the same ref. Saves CI
# minutes + makes the "latest run" the only one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow is read-only against the repo. Tighten the default token scope so
# a compromised action can't push code or modify issues.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node says >=20. Verify both LTS minors that satisfy that:
        # 20 (current LTS) and 22 (latest the package locks against).
        node-version: [20, 22]
    name: build (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Em-dash gate. Travis design canon forbids em dashes in code, docs,
      # copy, commit messages. See docs/design.md. Fails the build on any
      # em-dash (U+2014) anywhere in source. Uses PCRE codepoint regex so
      # the source of this gate itself contains no literal em-dash.
      - name: Em-dash gate
        run: |
          if grep -rPn '\x{2014}' \
            --include="*.md" --include="*.ts" --include="*.tsx" \
            --include="*.mjs" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=.turbo --exclude-dir=dist .; then
            echo "::error::Em dashes found. Replace with colon, period, or parens. See docs/design.md."
            exit 1
          fi

      - name: Build (all workspaces)
        run: pnpm -r build

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Lint (root + workspaces)
        run: pnpm lint

      - name: Test (all workspaces)
        run: pnpm -r test

      # Make the built widget bundle inspectable from the run summary so a
      # reviewer can sanity-check size deltas without cloning + building.
      # Only upload from the Node 22 matrix slot to avoid duplicate artifacts.
      - name: Upload widget dist
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: widget-dist
          path: packages/widget/dist
          retention-days: 14
          if-no-files-found: error
