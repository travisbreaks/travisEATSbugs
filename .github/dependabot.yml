version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    # Per-package PRs (no grouping). Group PRs proved unmergeable when even
    # one package in the group had breaking changes: the 2026-05-20 first
    # dependabot run produced PR #31 (dev-deps: Biome 2 + Vitest 4 + TS 6 +
    # Wrangler 4 + happy-dom 20) and PR #32 (prod-deps: @medv/finder v4 +
    # next v16), both CI-red and blocked on per-package migration work.
    # Splitting per-package lets the safe updates merge cleanly while the
    # breaking ones get their own per-package PR for review.
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels:
      - ci
      - dependencies
