# travisEATSbugs default backend worker.
#
# Deployed at eats.travisfixes.com. Hosts the REST contract that
# @travisbreaks/travisEATSbugs-http expects, backed by a D1 database
# whose schema lives in packages/adapter-cloudflare/migrations/.
#
# Before first deploy:
#   1. wrangler login                                  (one-time OAuth)
#   2. wrangler d1 create travisEATSbugs               (record the id below)
#   3. wrangler d1 migrations apply travisEATSbugs --remote
#   4. wrangler secret put SHARE_TOKEN_SECRET          (HMAC key)
#   5. wrangler deploy
#
# The `database_id` placeholder below is intentionally blank so a fresh
# clone does not point at a stale D1 instance. Fill in after step 2.

name = "travis-eats-bugs-worker"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

# Live route. Uncomment after the DNS record exists at eats.travisfixes.com.
# routes = [
#   { pattern = "eats.travisfixes.com/*", custom_domain = true }
# ]

[[d1_databases]]
binding = "DB"
database_name = "travisEATSbugs"
database_id = ""
migrations_dir = "../../packages/adapter-cloudflare/migrations"

# R2 binding for v0.5 screenshot capture. No-op for v0.2.
# [[r2_buckets]]
# binding = "SCREENSHOTS"
# bucket_name = "travis-eats-bugs-screenshots"

[vars]
# Comma-separated list of project tokens recognized as "members" (full
# read/write). Reporters using share-link tokens get scoped access.
# Override at deploy time with `wrangler secret put MEMBER_TOKENS`.
MEMBER_TOKENS = ""

# CORS allow-list (comma-separated origins). Empty = allow all (dev only).
ALLOWED_ORIGINS = ""
